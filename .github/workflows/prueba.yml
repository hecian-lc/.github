# Valida los workflows de este repo con actionlint en cada cambio.
name: Prueba de los workflows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  ci-node-ejemplo:
    name: ci-node sobre un proyecto mínimo
    uses: ./.github/workflows/ci-node.yml
    with:
      directorio: pruebas/node

  marca-ejemplo:
    name: marca (aviso)
    uses: ./.github/workflows/marca.yml
