# Imágenes Docker en ghcr.io (reutilizable). Sale del release de frio-scada.
#
#   on:
#     push:
#       tags: ['v*']
#   jobs:
#     imagenes:
#       uses: hecian-lc/.github/.github/workflows/release-docker.yml@v1
#       permissions:
#         contents: read
#         packages: write
#       with:
#         version: ${{ github.ref_name }}
#         imagenes: |
#           [ {"nombre": "api", "contexto": "nodered/weg-api"},
#             {"nombre": "frontend", "contexto": "frontend-react"} ]
#
# Publica ghcr.io/<organización>/<prefijo>-<nombre>:<versión>, y :latest solo
# si la versión es estable (vX.Y.Z sin sufijo). Por defecto el prefijo es el
# nombre del repo. Ojo: la primera vez, el paquete queda privado; si las
# plantas lo bajan sin login, ponerlo público en la configuración del paquete.
name: Imágenes Docker

on:
  workflow_call:
    inputs:
      version:
        description: Etiqueta de las imágenes (vX.Y.Z, edge…)
        type: string
        required: true
      imagenes:
        description: 'JSON: lista de {"nombre": …, "contexto": …}'
        type: string
        required: true
      prefijo:
        description: Prefijo de las imágenes (por defecto, el nombre del repo)
        type: string
        default: ''
      plataformas:
        type: string
        default: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    name: Imagen ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(inputs.imagenes) }}
    steps:
      - uses: actions/checkout@v7
      # arm64 para los servidores de planta (Raspberry Pi), emulado con QEMU
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas
        id: etiquetas
        env:
          VERSION: ${{ inputs.version }}
          PREFIJO: ${{ inputs.prefijo }}
          NOMBRE: ${{ matrix.nombre }}
        run: |
          prefijo="${PREFIJO:-${GITHUB_REPOSITORY#*/}}"
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${prefijo,,}-${NOMBRE}"
          tags="$img:$VERSION"
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then tags="$tags,$img:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexto }}
          platforms: ${{ inputs.plataformas }}
          push: true
          tags: ${{ steps.etiquetas.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.vendor=HECIAN LC
            org.opencontainers.image.licenses=LicenseRef-HECIAN-LC-Propietaria
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}
